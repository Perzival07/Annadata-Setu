version: '3.8'

services:
  channel:
    build: ./channel
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MOCK_MODE=true
      - BRAIN_URL=http://brain:8002
      - GROUND_URL=http://ground:8003
    env_file:
      - .env

  brain:
    build: ./brain
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MOCK_MODE=true
      - GROUND_URL=http://ground:8003
    env_file:
      - .env

  ground:
    build: ./ground
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - MOCK_MODE=true
    env_file:
      - .env
